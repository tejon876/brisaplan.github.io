name: Build Android APK (BrisaPlan)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare www bundle for Capacitor
        run: |
          rm -rf www android
          mkdir -p www
          cp -r index.html manifest.json sw.js oauth-bridge.html css js www/
          if [ -d "widgets" ]; then cp -r widgets www/; fi

      - name: Initialize Capacitor and build APK
        run: |
          npm init -y
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/browser@6 @capacitor/preferences@6 @capacitor/local-notifications@6 @codetrix-studio/capacitor-google-auth@3.4.0-rc.4
          npx cap add android
          npx cap sync android
          mkdir -p android/app/src/main/assets/public
          cp -rf www/* android/app/src/main/assets/public/
          if [ -f "native-android/brisaplan-debug.keystore" ]; then
            mkdir -p ~/.android
            cp native-android/brisaplan-debug.keystore ~/.android/debug.keystore
            cp native-android/brisaplan-debug.keystore android/app/debug.keystore
          fi
          python3 - << 'PYEOF'
          from pathlib import Path

          strings_path = Path("android/app/src/main/res/values/strings.xml")
          if strings_path.exists():
              s_xml = strings_path.read_text(encoding="utf-8")
              if 'name="server_client_id"' not in s_xml and "</resources>" in s_xml:
                  s_xml = s_xml.replace("</resources>", '    <string name="server_client_id">1015496019382-aneel8ga9orksq1uvv1ot1d1fmg61c67.apps.googleusercontent.com</string>\n</resources>', 1)
                  strings_path.write_text(s_xml, encoding="utf-8")

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          if manifest_path.exists():
              content = manifest_path.read_text(encoding="utf-8")
              perms = [
                  '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
                  '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
                  '<uses-permission android:name="android.permission.WAKE_LOCK" />'
              ]
              for perm in perms:
                  if perm not in content and "<application" in content:
                      content = content.replace("<application", f"    {perm}\n    <application", 1)
              manifest_path.write_text(content, encoding="utf-8")
          PYEOF
          if [ -d "android-widget-template/app/src/main" ]; then
            cp -r android-widget-template/app/src/main/* android/app/src/main/
          fi
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF
          cd android && ./gradlew assembleDebug

      - name: Rename APK to BrisaPlan.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk BrisaPlan.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrisaPlan-APK
          path: BrisaPlan.apk

      - name: Publish BrisaPlan.apk to Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.8.${{ github.run_number }}
          name: BrisaPlan v7.8.${{ github.run_number }}
          files: BrisaPlan.apk
          make_latest: true

name: Build BrisaPlan Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Sync web assets and Capacitor Android
        run: |
          mkdir -p www
          cp -f index.html styles.css app.js manifest.json sw.js www/
          CAP_BIN="./node_modules/.bin/cap"
          if [ ! -d "android" ]; then
            "$CAP_BIN" add android
          fi
          "$CAP_BIN" sync android

      - name: Inject Native Signing, Widgets & Manifest
        run: |
          if [ -f "native-android/inject_native.py" ]; then
            python3 native-android/inject_native.py
          fi

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk BrisaPlan.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrisaPlan-APK
          path: BrisaPlan.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v10.0.${{ github.run_number }}
          name: BrisaPlan v10.0.${{ github.run_number }}
          files: BrisaPlan.apk
          make_latest: true

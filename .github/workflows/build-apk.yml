name: Build Android APK (BrisaPlan)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare www bundle for Capacitor
        run: |
          rm -rf www android
          mkdir -p www
          cp -r index.html manifest.json sw.js oauth-bridge.html css js www/
          if [ -d "widgets" ]; then cp -r widgets www/; fi

      - name: Initialize Capacitor and build APK
        run: |
          npm init -y
          npm install --no-save @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/app@6 @capacitor/browser@6 @capacitor/preferences@6 @capacitor/local-notifications@6 @codetrix-studio/capacitor-google-auth@3.4.0-rc.4
          npx cap add android
          npx cap sync android
          mkdir -p android/app/src/main/assets/public
          cp -rf www/* android/app/src/main/assets/public/
          python3 native-android/inject_native.py
          cd android && ./gradlew assembleDebug

      - name: Rename APK to BrisaPlan.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk BrisaPlan.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrisaPlan-APK
          path: BrisaPlan.apk

      - name: Publish BrisaPlan.apk to Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v7.9.${{ github.run_number }}
          name: BrisaPlan v7.9.${{ github.run_number }}
          files: BrisaPlan.apk
          make_latest: true

name: Build Android APK (BrisaPlan)

on:
  push:
    branches: [ "main", "master" ]
  release:
    types: [ created, published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Prepare www bundle for Capacitor
        run: |
          mkdir -p www
          cp -r index.html manifest.json sw.js css js www/
          if [ -d "widgets" ]; then cp -r widgets www/; fi

      - name: Initialize Capacitor and build APK
        run: |
          npm init -y
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap copy android
          python3 - << 'PYEOF'
          from pathlib import Path

          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          if manifest_path.exists():
              content = manifest_path.read_text(encoding="utf-8")
              intent_filter = """        <intent-filter>
            <action android:name="android.intent.action.VIEW" />
            <category android:name="android.intent.category.DEFAULT" />
            <category android:name="android.intent.category.BROWSABLE" />
            <data android:scheme="brisaplan" />
          </intent-filter>"""
              if 'android:scheme="brisaplan"' not in content and "</activity>" in content:
                  content = content.replace("</activity>", f"{intent_filter}\n      </activity>", 1)
                  manifest_path.write_text(content, encoding="utf-8")
          PYEOF
          if [ -d "android-widget-template/app/src/main" ]; then
            cp -r android-widget-template/app/src/main/* android/app/src/main/
          fi
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          EOF
          cd android && ./gradlew assembleDebug

      - name: Rename APK to BrisaPlan.apk
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk BrisaPlan.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrisaPlan-APK
          path: BrisaPlan.apk

      - name: Publish BrisaPlan.apk to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag.name }}" BrisaPlan.apk --clobber

name: Build Android APK (BrisaPlan)

on:
  push:
    branches: [ "main", "master" ]
  release:
    types: [ created, published ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare www bundle for Capacitor
        run: |
          mkdir -p www
          cp -r index.html manifest.json sw.js css js widgets www/ 2>/dev/null || cp -r index.html manifest.json sw.js css js www/

      - name: Initialize Capacitor and build APK
        run: |
          npm init -y
          npm install --no-save @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || true
          npx cap copy android
          cd android && ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrisaPlan-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrisaPlan — Desktop Glass Widget</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0369a1 100%);
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 36px;
      color: #f8fafc;
    }
    .glass-widget {
      width: 340px;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(186, 230, 253, 0.25);
      border-radius: 22px;
      padding: 22px;
      box-shadow: 0 20px 40px rgba(2, 6, 23, 0.45);
    }
    .widget-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .widget-title { font-size: 1rem; font-weight: 700; color: #bae6fd; }
    .widget-clock { font-size: 0.85rem; color: #cbd5e1; }
    .widget-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.07);
      margin-bottom: 8px;
      font-size: 0.88rem;
    }
    .widget-item.done { opacity: 0.55; text-decoration: line-through; }
    .badge {
      background: rgba(56, 189, 248, 0.2);
      color: #7dd3fc;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="glass-widget">
    <div class="widget-header">
      <span class="widget-title">BrisaPlan · Hoy</span>
      <span id="clock" class="widget-clock"></span>
    </div>
    <div id="widget-list"></div>
  </div>

  <script>
    function renderWidget() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
      const offset = now.getTimezoneOffset() * 60000;
      const today = new Date(now - offset).toISOString().split('T')[0];

      let habits = [];
      try {
        const raw = localStorage.getItem('brisaplan_state_v1');
        if (raw) habits = JSON.parse(raw).habits || [];
      } catch {}

      const container = document.getElementById('widget-list');
      if (!habits.length) {
        container.innerHTML = '<div class="widget-item">Abre BrisaPlan para agregar hábitos</div>';
        return;
      }

      container.innerHTML = habits.map(h => {
        const done = h.lastCompletedDate === today;
        return `<div class="widget-item ${done ? 'done' : ''}">
          <span>${done ? '✓' : '○'} ${h.name}</span>
          <span class="badge">${h.streak || 0}d</span>
        </div>`;
      }).join('');
    }
    renderWidget();
    setInterval(renderWidget, 5000);
  </script>
</body>
</html>

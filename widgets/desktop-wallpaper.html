<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BrisaPlan — Widgets Cristal</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0F172A 0%, #1E3A5F 55%, #4A93C6 100%);
      min-height: 100vh;
      padding: 28px;
      color: #F8FAFC;
      display: flex;
      flex-wrap: wrap;
      gap: 18px;
      align-items: flex-start;
      justify-content: flex-end;
    }
    .glass-card {
      width: 310px;
      background: rgba(15, 23, 42, 0.48);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(189, 224, 254, 0.28);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 18px 36px rgba(2, 6, 23, 0.4);
    }
    .w-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-weight: 700;
      font-size: 0.94rem;
      color: #BDE0FE;
    }
    .w-empty {
      font-size: 0.82rem;
      color: #CBD5E1;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <div class="w-head"><span>BrisaPlan · Cloud Firestore</span><span>AES-256</span></div>
    <p class="w-empty">Tus datos están cifrados con AES-GCM y sincronizados en la nube. Inicia sesión en BrisaPlan para ver tus tareas y hábitos en tiempo real.</p>
  </div>
</body>
</html>
